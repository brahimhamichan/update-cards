name: Bug report
description: Report a problem with update-cards
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, email brahim@scalingadventures.com as described in SECURITY.md. Do not include details here.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest safe config or command that shows the issue.
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your operating system, Node.js version, and update-cards commit or version.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed webhook URLs, tokens, real user responses, and private screenshots or data.
          required: true
